#config-version=FGT60F-7.4.6-FW-build2726-241119:opmode=1:vdom=0:user=admin
#conf_file_ver=0
#buildno=2726
#global_vdom=1
config system global
    set alias "sample-60f"
    set hostname "sample-60f"
    set timezone "Asia/Tokyo"
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 192.0.2.2 255.255.255.0
        set allowaccess ping https
        set type physical
        set role wan
    next
    edit "wan2"
        set vdom "root"
        set mode dhcp
        set type physical
        set role wan
    next
    edit "internal1"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
    edit "fortilink"
        set vdom "root"
        set fortilink enable
        set ip 198.18.255.1 255.255.255.0
        set allowaccess ping fabric
        set type aggregate
        set lldp-reception vdom
        set lldp-transmission enable
    next
end
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set gateway 192.0.2.1
        next
        edit 2
            set interface "wan2"
        next
    end
end
config firewall local-in-policy
    edit 1
        set intf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set service "ALL"
        set schedule "always"
    next
end
config vpn ssl web portal
    edit "full-access"
        set tunnel-mode enable
        set web-mode enable
        set ip-pools "SSLVPN_TUNNEL_ADDR1"
    next
end
config vpn ssl settings
    set servercert "Fortinet_Factory"
    set tunnel-ip-pools "SSLVPN_TUNNEL_ADDR1"
    set port 10443
    set source-interface "wan1"
    set source-address "all"
    set default-portal "full-access"
end
config vpn ipsec phase1-interface
    edit "TO-HQ"
        set interface "wan1"
        set peertype any
        set proposal aes256-sha256
        set remote-gw 203.0.113.10
        set psksecret ENC EXAMPLEONLY
    next
end
config vpn ipsec phase2-interface
    edit "TO-HQ-P2"
        set phase1name "TO-HQ"
        set proposal aes256-sha256
    next
end
config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "internal1"
        set dstintf "virtual-wan-link"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set ips-sensor "default"
        set nat enable
    next
    edit 2
        set name "SSLVPN-to-LAN"
        set srcintf "ssl.root"
        set dstintf "internal1"
        set action accept
        set srcaddr "SSLVPN_TUNNEL_ADDR1"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set groups "vpn-users"
    next
end
config firewall ssl-ssh-profile
    edit "certificate-inspection"
        set comment "Read-only SSL handshake inspection profile."
        config https
            set ports 443
            set status certificate-inspection
        end
    next
end
config switch-controller managed-switch
    edit "S108FFTF00000001"
        set fsw-wan1-peer "fortilink"
        set fsw-wan1-admin enable
    next
end
